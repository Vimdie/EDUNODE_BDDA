{% extends 'base.html' %}

{% block title %}Connexion - Edunode{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <div style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <h2>Bienvenue</h2>
            <p class="text-muted">Veuillez vous identifier pour accéder au système.</p>
        </div>

        <form method="POST" action="">
            <div class="form-group">
                <label for="email" class="form-label"><i class="fa-solid fa-envelope"></i> Adresse Email</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="nom@ecole.com">
            </div>

            <div class="form-group mb-4">
                <label for="password" class="form-label"><i class="fa-solid fa-lock"></i> Mot de passe</label>
                <input type="password" id="password" name="password" class="form-control" required
                    placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-block">
                Se connecter <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="mt-2 text-center text-muted"
            style="font-size: 0.8rem; margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
            <strong>Comptes de test (Mot de passe : 1234) :</strong><br>
            etudiant1@ecole.com | professeur1@ecole.com | admin1@ecole.com
        </div>
    </div>
</div>
{% endblock %}
